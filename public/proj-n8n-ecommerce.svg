<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="500" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="500" height="300" fill="url(#bg)" rx="12"/>
  <!-- Top bar -->
  <rect width="500" height="40" fill="#1c2128" rx="12"/>
  <rect y="28" width="500" height="12" fill="#1c2128"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="20" r="6" fill="#febc2e"/>
  <circle cx="56" cy="20" r="6" fill="#28c840"/>
  <text x="250" y="25" text-anchor="middle" font-size="12" fill="#8b949e" font-family="monospace">n8n · E-commerce Order Workflow · Active</text>

  <!-- n8n canvas background -->
  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.8" fill="#30363d"/>
  </pattern>
  <rect x="0" y="40" width="500" height="260" fill="url(#dots)"/>

  <!-- Node: Shopify Webhook -->
  <rect x="18" y="110" width="100" height="56" rx="8" fill="#1f2937" stroke="#e07b39" stroke-width="2"/>
  <rect x="18" y="110" width="100" height="20" rx="8" fill="#e07b39" opacity="0.2"/>
  <rect x="18" y="122" width="100" height="8" fill="#e07b39" opacity="0.2"/>
  <text x="68" y="124" text-anchor="middle" font-size="8" fill="#e07b39" font-family="monospace" font-weight="bold">SHOPIFY</text>
  <text x="68" y="138" text-anchor="middle" font-size="9" fill="#f0f6fc" font-family="monospace">Webhook Trigger</text>
  <text x="68" y="152" text-anchor="middle" font-size="8" fill="#8b949e" font-family="monospace">New Order</text>
  <circle cx="118" cy="138" r="5" fill="#e07b39"/>

  <!-- Arrow 1 -->
  <line x1="123" y1="138" x2="148" y2="138" stroke="#e07b39" stroke-width="2"/>
  <polygon points="145,134 152,138 145,142" fill="#e07b39"/>

  <!-- Node: Google Sheets -->
  <rect x="152" y="88" width="100" height="56" rx="8" fill="#1f2937" stroke="#7b8a5a" stroke-width="2"/>
  <rect x="152" y="88" width="100" height="20" rx="8" fill="#7b8a5a" opacity="0.2"/>
  <rect x="152" y="100" width="100" height="8" fill="#7b8a5a" opacity="0.2"/>
  <text x="202" y="102" text-anchor="middle" font-size="8" fill="#7b8a5a" font-family="monospace" font-weight="bold">GOOGLE SHEETS</text>
  <text x="202" y="116" text-anchor="middle" font-size="9" fill="#f0f6fc" font-family="monospace">Update Row</text>
  <text x="202" y="130" text-anchor="middle" font-size="8" fill="#8b949e" font-family="monospace">Inventory -1</text>
  <circle cx="152" cy="116" r="5" fill="#7b8a5a"/>
  <circle cx="252" cy="116" r="5" fill="#7b8a5a"/>

  <!-- Arrow 2 -->
  <line x1="257" y1="116" x2="282" y2="116" stroke="#7b8a5a" stroke-width="2"/>
  <polygon points="279,112 286,116 279,120" fill="#7b8a5a"/>

  <!-- Node: Gmail -->
  <rect x="286" y="88" width="100" height="56" rx="8" fill="#1f2937" stroke="#ca9f6a" stroke-width="2"/>
  <rect x="286" y="88" width="100" height="20" rx="8" fill="#ca9f6a" opacity="0.2"/>
  <rect x="286" y="100" width="100" height="8" fill="#ca9f6a" opacity="0.2"/>
  <text x="336" y="102" text-anchor="middle" font-size="8" fill="#ca9f6a" font-family="monospace" font-weight="bold">GMAIL</text>
  <text x="336" y="116" text-anchor="middle" font-size="9" fill="#f0f6fc" font-family="monospace">Send Email</text>
  <text x="336" y="130" text-anchor="middle" font-size="8" fill="#8b949e" font-family="monospace">Order Confirm</text>
  <circle cx="286" cy="116" r="5" fill="#ca9f6a"/>
  <circle cx="386" cy="116" r="5" fill="#ca9f6a"/>

  <!-- Arrow 3 -->
  <line x1="391" y1="116" x2="416" y2="116" stroke="#ca9f6a" stroke-width="2"/>
  <polygon points="413,112 420,116 413,120" fill="#ca9f6a"/>

  <!-- Node: Slack -->
  <rect x="420" y="88" width="68" height="56" rx="8" fill="#1f2937" stroke="#7b8a5a" stroke-width="2"/>
  <rect x="420" y="88" width="68" height="20" rx="8" fill="#7b8a5a" opacity="0.15"/>
  <rect x="420" y="100" width="68" height="8" fill="#7b8a5a" opacity="0.15"/>
  <text x="454" y="102" text-anchor="middle" font-size="8" fill="#7b8a5a" font-family="monospace" font-weight="bold">SLACK</text>
  <text x="454" y="116" text-anchor="middle" font-size="9" fill="#f0f6fc" font-family="monospace">Notify</text>
  <text x="454" y="130" text-anchor="middle" font-size="8" fill="#8b949e" font-family="monospace">#orders</text>
  <circle cx="420" cy="116" r="5" fill="#7b8a5a"/>

  <!-- Second row — IF node -->
  <!-- Line down from Shopify -->
  <line x1="68" y1="166" x2="68" y2="185" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="64,183 68,190 72,183" fill="#e07b39"/>

  <!-- Node: IF duplicate check -->
  <rect x="18" y="190" width="100" height="56" rx="8" fill="#1f2937" stroke="#ca9f6a" stroke-width="1.5"/>
  <text x="68" y="210" text-anchor="middle" font-size="8" fill="#ca9f6a" font-family="monospace" font-weight="bold">IF</text>
  <text x="68" y="224" text-anchor="middle" font-size="9" fill="#f0f6fc" font-family="monospace">Duplicate?</text>
  <text x="68" y="237" text-anchor="middle" font-size="8" fill="#8b949e" font-family="monospace">order_id check</text>
  <circle cx="118" cy="218" r="5" fill="#28c840"/>
  <circle cx="118" cy="228" r="5" fill="#ff5f57"/>

  <!-- true/false labels -->
  <text x="125" y="222" font-size="8" fill="#28c840" font-family="monospace">false→</text>
  <text x="125" y="232" font-size="8" fill="#ff5f57" font-family="monospace">true→skip</text>

  <!-- Execution log -->
  <rect x="152" y="170" width="234" height="76" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="165" y="185" font-size="9" fill="#8b949e" font-family="monospace">Execution Log</text>
  <text x="165" y="200" font-size="8" fill="#28c840" font-family="monospace">✓ #1042 processed · 0.3s</text>
  <text x="165" y="212" font-size="8" fill="#28c840" font-family="monospace">✓ Inventory updated · row 87</text>
  <text x="165" y="224" font-size="8" fill="#28c840" font-family="monospace">✓ Email sent · john@doe.com</text>
  <text x="165" y="236" font-size="8" fill="#28c840" font-family="monospace">✓ Slack notified · #orders</text>

  <!-- Stats bar -->
  <rect x="0" y="265" width="500" height="35" fill="#1c2128"/>
  <text x="20" y="285" font-size="9" fill="#28c840" font-family="monospace">● Active</text>
  <text x="80" y="285" font-size="9" fill="#8b949e" font-family="monospace">Executions: 1,247</text>
  <text x="210" y="285" font-size="9" fill="#8b949e" font-family="monospace">Success: 99.8%</text>
  <text x="330" y="285" font-size="9" fill="#8b949e" font-family="monospace">Last run: 2m ago</text>
</svg>
