  <rect x="424" y="228" width="60" height="24" rx="4" fill="#28c840" opacity="0.1" stroke="#28c840" stroke-width="0.8"/>
  <text x="454" y="244" text-anchor="middle" font-size="9" fill="#28c840" font-family="monospace">● Live</text>

