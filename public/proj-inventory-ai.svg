  <text x="22" y="100" font-size="7" fill="#f0f6fc" font-family="monospace">SKU-001</text>
  <text x="90" y="100" font-size="7" fill="#e07b39" font-family="monospace">12</text>
  <text x="123" y="100" font-size="7" fill="#e07b39" font-family="monospace">3d</text>
  <circle cx="163" cy="97" r="4" fill="#e07b39"/>

  <rect x="14" y="110" width="163" height="20" rx="3" fill="#febc2e" opacity="0.05" stroke="#febc2e" stroke-width="0.5"/>
