  <text x="202" y="214" font-size="7" fill="#f0f6fc" font-family="monospace">SKU-001 → 200 units</text>
  <text x="202" y="226" font-size="7" fill="#8b949e" font-family="monospace">WooCommerce API ✓</text>
  <text x="202" y="238" font-size="7" fill="#8b949e" font-family="monospace">Supplier email sent ✓</text>
  <text x="202" y="250" font-size="7" fill="#28c840" font-family="monospace">n8n triggered · 06:00</text>

