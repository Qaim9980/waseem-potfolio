  <text x="115" y="282" font-size="8" fill="#8b949e" font-family="monospace">Last retrain: 2 days ago</text>
  <text x="290" y="282" font-size="8" fill="#e07b39" font-family="monospace">⚠ 2 SKUs critical</text>
  <text x="400" y="282" font-size="8" fill="#8b949e" font-family="monospace">Next run: 06:00</text>
