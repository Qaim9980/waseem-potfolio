  <text x="90" y="123" font-size="7" fill="#febc2e" font-family="monospace">48</text>
  <text x="123" y="123" font-size="7" fill="#febc2e" font-family="monospace">8d</text>
  <circle cx="163" cy="120" r="4" fill="#febc2e"/>

  <rect x="14" y="133" width="163" height="20" rx="3" fill="#0d1117"/>
  <text x="22" y="146" font-size="7" fill="#f0f6fc" font-family="monospace">SKU-003</text>
  <text x="90" y="146" font-size="7" fill="#28c840" font-family="monospace">210</text>
  <text x="123" y="146" font-size="7" fill="#28c840" font-family="monospace">42d</text>
  <circle cx="163" cy="143" r="4" fill="#28c840"/>

  <rect x="14" y="156" width="163" height="20" rx="3" fill="#0d1117"/>
  <text x="22" y="169" font-size="7" fill="#f0f6fc" font-family="monospace">SKU-004</text>
  <text x="90" y="169" font-size="7" fill="#28c840" font-family="monospace">155</text>
  <text x="123" y="169" font-size="7" fill="#28c840" font-family="monospace">31d</text>
