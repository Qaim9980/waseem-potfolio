  <text x="355" y="201" font-size="8" fill="#ca9f6a" font-family="monospace">Model Stack</text>
  <text x="355" y="214" font-size="7" fill="#f0f6fc" font-family="monospace">LSTM · seasonal patterns</text>
  <text x="355" y="226" font-size="7" fill="#f0f6fc" font-family="monospace">XGBoost · short-term</text>
  <text x="355" y="238" font-size="7" fill="#8b949e" font-family="monospace">Stacking ensemble</text>
  <text x="355" y="250" font-size="7" fill="#28c840" font-family="monospace">Stockouts ↓ 82%</text>

