  <rect x="14" y="166" width="148" height="28" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="22" y="178" font-size="8" fill="#f0f6fc" font-family="monospace">Wireless Earbuds</text>
  <text x="22" y="188" font-size="7" fill="#8b949e" font-family="monospace">$45.00 (stable)</text>

  <rect x="14" y="198" width="148" height="28" rx="4" fill="#0d1117" stroke="#e07b39" stroke-width="0.8"/>
  <text x="22" y="210" font-size="8" fill="#f0f6fc" font-family="monospace">Laptop Stand</text>
  <text x="22" y="220" font-size="7" fill="#e07b39" font-family="monospace">▼ $19.50 (-22%)</text>
