  <rect x="390" y="73" width="60" height="14" rx="3" fill="#e07b39" opacity="0.2" stroke="#e07b39" stroke-width="0.8"/>
  <text x="420" y="83" text-anchor="middle" font-size="7" fill="#e07b39" font-family="monospace">ALERT!</text>

