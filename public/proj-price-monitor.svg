  <rect x="8" y="266" width="484" height="26" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="282" font-size="8" fill="#8b949e" font-family="monospace">Scraped: 6h ago</text>
  <text x="145" y="282" font-size="8" fill="#28c840" font-family="monospace">● 500 products live</text>
  <text x="290" y="282" font-size="8" fill="#8b949e" font-family="monospace">Alerts sent today: 7</text>
  <text x="400" y="282" font-size="8" fill="#8b949e" font-family="monospace">Proxies: 12 active</text>
